name: data-refresh

on:
  schedule:
    # every 12 hours during tournament window; manual otherwise
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Refresh free public data sources
        env:
          # All optional — workflow handles missing creds gracefully
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Kalshi public read API (no key required)
          uv run python -m src.data.fetch_kalshi_markets || echo "Kalshi fetch skipped"
          # Weather forecast/climatology (free Open-Meteo, no key)
          uv run python -m src.data.fetch_weather --max-fixtures 104 || echo "Weather fetch skipped"
          # Team metadata is static (commit-time table)
          uv run python -m src.data.team_metadata

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/kalshi data/processed/venue_weather.parquet data/fixtures/team_metadata.parquet || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): scheduled refresh ($(date -u +%Y-%m-%d_%H:%MZ))"
            git push
          fi
